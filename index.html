<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Globe Athlete Tool</title>
<style>
:root{--bg:#090909;--panel:#121212;--line:#292929;--orange:#f28c28;--ath:#35d6d0;--acad:#4da3ff;--str:#ff5b5b;--bonus:#c084fc;--white:#f5f5f5;--muted:#8e8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.brand{font-weight:950;letter-spacing:.08em;margin-bottom:22px}.brand span{color:var(--orange)}.muted{color:var(--muted)}.panel,.section{background:var(--panel);border:1px solid var(--line);border-radius:16px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.switch{display:flex;gap:8px}.switch input{display:none}.switch label,select,input[type=search],button{background:#161616;color:#eee;border:1px solid #383838;border-radius:10px;padding:10px 12px}.switch label:has(input:checked){background:var(--orange);color:#111;border-color:var(--orange);font-weight:900}select,input[type=search]{font-weight:700}button{cursor:pointer}.status{font-size:12px;color:#888;margin:8px 0 14px}.count{color:var(--orange);font-weight:900}table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px;background:var(--panel)}th{background:var(--orange);color:#111;text-align:left}th,td{padding:12px;border-bottom:1px solid var(--line)}.name{font-weight:850;cursor:pointer}.name:hover{color:var(--orange)}.metricValue{font-weight:950;color:var(--orange)}.hide{display:none}.profileHead{margin:20px 0 14px}.profileHead h1{margin:0;font-size:34px}.overall{text-align:center;margin:24px 0 18px}.overall .num{font-size:86px;font-weight:950;letter-spacing:-.06em;line-height:.95}.overall .label{font-size:11px;color:#888;letter-spacing:.2em;margin-top:7px}.components{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto 28px;text-align:center}.comp{padding:12px}.comp b{font-size:20px}.comp small{display:block;margin-top:4px;font-size:10px;letter-spacing:.13em;font-weight:900}.acad b,.acad small{color:var(--acad)}.ath b,.ath small{color:var(--ath)}.str b,.str small{color:var(--str)}.section{margin:14px 0;overflow:hidden}.sectionHead{display:flex;align-items:end;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.sectionHead h2{margin:0;font-size:18px}.sectionScore{font-size:30px;font-weight:950}.academics{border-top:3px solid var(--acad)}.athleticism{border-top:3px solid var(--ath)}.strength{border-top:3px solid var(--str)}.bonusSec{border-top:3px solid var(--bonus)}.academics h2,.academics .sectionScore{color:var(--acad)}.athleticism h2,.athleticism .sectionScore{color:var(--ath)}.strength h2,.strength .sectionScore{color:var(--str)}.bonusSec h2,.bonusSec .sectionScore{color:var(--bonus)}.metric{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:13px 18px;border-bottom:1px solid #242424}.metric:last-child{border:0}.result{font-weight:800}.stars{white-space:nowrap}.calc{margin:14px 0;padding:16px 18px}.calcRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #242424}.calcRow:last-child{border:0}.calc .acadText{color:var(--acad)}.calc .athText{color:var(--ath)}.calc .strText{color:var(--str)}.calc .bonusText{color:var(--bonus)}.calc .total{font-weight:950;color:var(--orange)}.sports{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #3b3b3b;border-radius:999px;padding:6px 9px;font-size:12px;background:#151515}.empty{color:#777;font-size:13px;padding:14px 18px}.back{margin-bottom:6px}.directoryNote{margin-top:10px;font-size:12px;color:#777}@media(max-width:650px){.wrap{padding:16px}.filters>*{flex:1;min-width:140px}.switch{flex:0 0 auto}.overall .num{font-size:72px}.metric{grid-template-columns:1fr auto;gap:8px}.stars{grid-column:2;text-align:right}.profileHead h1{font-size:29px}}
</style></head><body><div class="wrap"><div class="brand"><span>GLOBE</span> · ATHLETE PROFILE</div>
<section id="board"><h1 style="margin-bottom:4px">Leaderboard</h1><div class="muted">Best valid recorded performances · Top 20 rankings · <span id="athleteCount" class="count"></span></div>
<div class="filters"><div class="switch"><label><input type="radio" name="gender" value="Male" checked>Male</label><label><input type="radio" name="gender" value="Female">Female</label></div>
<select id="year"><option value="All">All Years</option><option>Sr</option><option>Jr</option><option>So</option><option>Fr</option></select>
<select id="rank"><option value="overall">Overall Score</option><option value="academics">Academics</option><option value="athleticism">Athleticism</option><option value="strength">Strength</option><optgroup label="Athletic Tests"><option value="med">Med Ball Toss</option><option value="vert">Vertical Jump</option><option value="broad">Broad Jump</option><option value="pro">Pro Agility</option><option value="dash">40 Yard Dash</option></optgroup><optgroup label="Strength"><option value="bench">Bench Press</option><option value="squat">Back Squat</option><option value="dead">Deadlift</option><option value="clean">Clean</option><option value="club1000">1000 lbs Club</option></optgroup></select>
<input id="search" type="search" placeholder="Search any athlete"></div><div id="status" class="status"></div><table><thead><tr><th>#</th><th>Athlete</th><th>Year</th><th id="metricHead">Overall Score</th></tr></thead><tbody id="rows"></tbody></table><div class="directoryNote">Tip: search by name to open any high-school athlete profile, including athletes outside the current Top 20.</div></section>
<section id="profile" class="hide"><button class="back" onclick="showBoard()">← Leaderboard</button><div class="profileHead"><h1 id="pname"></h1><div id="pyear" class="muted"></div><div id="sports" class="sports"></div></div><div class="overall"><div id="overall" class="num"></div><div class="label">OVERALL SCORE</div></div><div class="components"><div class="comp acad"><b id="acad"></b><small>ACADEMICS</small></div><div class="comp ath"><b id="ath"></b><small>ATHLETICISM</small></div><div class="comp str"><b id="str"></b><small>STRENGTH</small></div></div><div id="sections"></div></section></div>
<script>window.ATHLETE_CHUNKS=[];</script><script src="athlete-data/male-sr.js"></script><script src="athlete-data/male-jr.js"></script><script src="athlete-data/male-so.js"></script><script src="athlete-data/male-fr.js"></script><script src="athlete-data/female-sr.js"></script><script src="athlete-data/female-jr-1.js"></script>
<script src="athlete-data/female-jr-2.js"></script><script src="athlete-data/female-so.js"></script><script src="athlete-data/female-fr.js"></script><script>
const RAW=window.ATHLETE_CHUNKS||[]
const KEYS=['med','vert','broad','pro','dash','bench','squat','dead','clean'];
const athletes=RAW.map(r=>{let i=12,t={},l={};for(let k=0;k<5;k++){let v=r[i++],s=r[i++];if(v!=null)t[KEYS[k]]={value:v,score:s}}for(let k=5;k<9;k++){let v=r[i++],s=r[i++];if(v!=null)l[KEYS[k]]={value:v,score:s}}return{id:r[0],name:r[1],year:r[2],gender:r[3],overall:r[4],academics:r[5],athleticism:r[6],strength:r[7],gpaRange:r[8],club1000:r[9],sportBonus:r[10],sports:r[11]||[],tests:t,lifts:l}});
const DATA={athletes};
const META={overall:['Overall Score','',false],academics:['Academics','',false],athleticism:['Athleticism','',false],strength:['Strength','',false],med:['Med Ball Toss',' ft',false],vert:['Vertical Jump',' in',false],broad:['Broad Jump',' in',false],pro:['Pro Agility',' sec',true],dash:['40 Yard Dash',' sec',true],bench:['Bench Press',' lb',false],squat:['Back Squat',' lb',false],dead:['Deadlift',' lb',false],clean:['Clean',' lb',false],club1000:['1000 lbs Club',' lb',false]};
const el=id=>document.getElementById(id),stars=n=>n?'★'.repeat(Math.max(0,Math.min(5,Math.round(n))))+'☆'.repeat(Math.max(0,5-Math.round(n))):'';
function metricValue(a,k){if(['overall','academics','athleticism','strength','club1000'].includes(k))return a[k]??null;return (['bench','squat','dead','clean'].includes(k)?a.lifts:a.tests)?.[k]?.value??null}
function fmt(k,v){if(v==null)return'—';if(['overall','academics','athleticism','strength'].includes(k))return Number(v).toFixed(1);if(k==='med')return Number(v).toFixed(1);if(k==='vert'){let q=Math.round(Number(v)*2)/2;return Number.isInteger(q)?String(q):q.toFixed(1)}if(k==='broad')return String(Math.round(Number(v)));if(k==='pro'||k==='dash')return Number(v).toFixed(2);return Number.isInteger(Number(v))?String(v):Number(v).toFixed(1)}
function draw(){let g=document.querySelector('input[name=gender]:checked').value,y=el('year').value,k=el('rank').value,q=el('search').value.trim().toLowerCase();let arr=DATA.athletes.filter(a=>a.gender===g&&(y==='All'||a.year===y)&&(!q||a.name.toLowerCase().includes(q))).map(a=>[a,metricValue(a,k)]);if(!q)arr=arr.filter(x=>x[1]!=null);arr.sort((a,b)=>a[1]==null?1:b[1]==null?-1:(META[k][2]?a[1]-b[1]:b[1]-a[1])||a[0].name.localeCompare(b[0].name));el('metricHead').textContent=META[k][0];let shown=q?arr:arr.slice(0,20);el('rows').innerHTML=shown.map((x,i)=>`<tr><td>${q?'—':i+1}</td><td class="name" onclick="openProfile('${x[0].id}')">${x[0].name}</td><td>${x[0].year}</td><td class="metricValue">${x[1]==null?'—':fmt(k,x[1])+META[k][1]}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No athletes found.</td></tr>';el('status').textContent=q?`${shown.length} matching athlete${shown.length===1?'':'s'} · click a name to open profile`:`${g} · ${y==='All'?'all grades':y} · ${META[k][0]}`}
function metricRow(label,k,obj){let m=obj?.[k];return m?`<div class="metric"><span>${label}</span><span class="result">${fmt(k,m.value)}${META[k][1]}</span><span class="stars">${stars(m.score)}</span></div>`:`<div class="metric"><span>${label}</span><span class="result">—</span><span></span></div>`}
function bonusRows(a,b){let s=a.sports||[];if(!s.length)return'<div class="empty">Sport assignments are not yet connected for this athlete. The participation bonus below is inferred from the official Athlete Score.</div>';let e=b==null?null:Math.round(b*10);if(e===s.length)return s.map(x=>`<div class="metric"><span>${x}</span><span class="result">+0.1</span><span></span></div>`).join('');return s.map(x=>`<div class="metric"><span>${x}</span><span class="result">Verified sport</span><span></span></div>`).join('')+'<div class="empty">The official participation bonus includes additional sport participation not yet linked to the public sport list.</div>'}
function openProfile(id){let a=DATA.athletes.find(x=>x.id===id);if(!a)return;el('board').classList.add('hide');el('profile').classList.remove('hide');el('pname').textContent=a.name;el('pyear').textContent=`${a.year} · ${a.gender}`;el('sports').innerHTML=(a.sports||[]).map(s=>`<span class="chip">${s}</span>`).join('');el('overall').textContent=fmt('overall',a.overall);el('acad').textContent=fmt('academics',a.academics);el('ath').textContent=fmt('athleticism',a.athleticism);el('str').textContent=fmt('strength',a.strength);let b=a.sportBonus==null?null:Number(a.sportBonus),avg=[a.academics,a.athleticism,a.strength].every(v=>Number.isFinite(Number(v)))?((+a.academics + +a.athleticism + +a.strength)/3):null;el('sections').innerHTML=`<div class="section academics"><div class="sectionHead"><h2>Academics</h2><div class="sectionScore">${fmt('academics',a.academics)}</div></div><div class="metric"><span>GPA Range</span><span class="result">${a.gpaRange||'—'}</span><span class="stars">${stars(a.academics)}</span></div></div><div class="section athleticism"><div class="sectionHead"><h2>Athleticism</h2><div class="sectionScore">${fmt('athleticism',a.athleticism)}</div></div>${metricRow('Med Ball Toss','med',a.tests)}${metricRow('Vertical Jump','vert',a.tests)}${metricRow('Broad Jump','broad',a.tests)}${metricRow('Pro Agility','pro',a.tests)}${metricRow('40 Yard Dash','dash',a.tests)}</div><div class="section strength"><div class="sectionHead"><h2>Strength</h2><div class="sectionScore">${fmt('strength',a.strength)}</div></div>${metricRow('Bench Press','bench',a.lifts)}${metricRow('Back Squat','squat',a.lifts)}${metricRow('Deadlift','dead',a.lifts)}${metricRow('Clean','clean',a.lifts)}<div class="metric"><span>1000 lbs Club</span><span class="result">${fmt('club1000',a.club1000)}${a.club1000==null?'':' lb'}</span><span></span></div></div><div class="section bonusSec"><div class="sectionHead"><h2>Sport Bonus</h2><div class="sectionScore">${b==null?'—':'+'+b.toFixed(1)}</div></div>${bonusRows(a,b)}</div><div class="panel calc"><b>Overall Score Calculation</b><div class="calcRow acadText"><span>Academics</span><span>${fmt('academics',a.academics)}</span></div><div class="calcRow athText"><span>Athleticism</span><span>${fmt('athleticism',a.athleticism)}</span></div><div class="calcRow strText"><span>Strength</span><span>${fmt('strength',a.strength)}</span></div><div class="calcRow"><span>Component Average</span><span>${avg==null?'—':avg.toFixed(1)}</span></div><div class="calcRow bonusText"><span>Sport Bonus</span><span>${b==null?'—':'+'+b.toFixed(1)}</span></div><div class="calcRow total"><span>Official Overall Score</span><span>${fmt('overall',a.overall)}</span></div></div>`;history.replaceState(null,'','#athlete='+encodeURIComponent(a.id));scrollTo(0,0)}
function showBoard(){el('profile').classList.add('hide');el('board').classList.remove('hide');history.replaceState(null,'',location.pathname)}
function boot(){el('athleteCount').textContent=`${DATA.athletes.length} athletes loaded`;document.querySelectorAll('input[name=gender]').forEach(x=>x.addEventListener('change',draw));['year','rank'].forEach(id=>el(id).addEventListener('change',draw));el('search').addEventListener('input',draw);let id=new URLSearchParams(location.hash.replace(/^#/, '')).get('athlete');draw();if(id&&DATA.athletes.some(a=>a.id===id))openProfile(id)}boot();
</script></body></html>
