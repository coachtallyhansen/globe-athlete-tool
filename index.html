function draw(){let g=document.querySelector('input[name=g]:checked').value,k=rankBy.value,y=yearFilter.value,a=(RANK[g][k]||[]).filter(x=>y==='All'||x[1]===y);metricHead.textContent=META[k][0];rankNote.textContent=k==='ow'?'1000 lbs Club = sum of the athlete’s three highest lift maxes.':(k==='pro'||k==='dash'?'Lower time ranks higher.':'Higher result ranks higher.');rows.innerHTML=a.slice(0,20).map((x,i)=>`<tr><td>${i+1}</td><td class="name" ${P[x[0]]?`onclick="openP('${x[0]}')"`:''}>${x[0]}</td><td>${x[1]}</td><td class="metricValue">${fmt(k,x[2])}${META[k][1]}</td></tr>`).join('')||'<tr><td colspan="4" style="color:#888">No ranked results in this class-year slice.</td></tr>'}
const stars=n=>n? '★'.repeat(n)+'☆'.repeat(5-n):''; function profileVal(m){let v=parseFloat(m[1]);if(!Number.isFinite(v))return m[1];if(m[0]==='Med Ball Toss'||m[0]==='Standing Broad Jump')return v.toFixed(1)+(m[1].includes('ft')?' ft':' in');if(m[0]==='Vertical Jump')return (Math.round(v*2)/2).toFixed(1)+' in';if(m[0]==='Pro Agility'||m[0]==='40 Yard Dash')return v.toFixed(2)+' sec';return m[1]} const metric=m=>`<div class="metric"><span>${m[0]}</span><span class="result">${profileVal(m)}</span><span class="stars">${stars(m[2])}</span></div>`;
function openP(n){let x=P[n];if(!x)return;board.classList.add('hide');profile.classList.remove('hide');pname.textContent=n;pyear.textContent=x.y;hero.className='hero '+(x.g==='Male'?'male':'female');hero.innerHTML=x.photo?`<img src="${x.photo}" alt="Athlete sport photo">`:`<div class="placeholder"><div><div class="tiger">♜</div><small>Primary sport photo / tiger placeholder</small></div></div>`;sports.innerHTML=x.sports.map(z=>`<span class="sportIcon" title="${z[1]}" style="display:inline-grid;margin-right:6px">${z[0]}</span>`).join('');overall.textContent=x.o.toFixed(1);acad.textContent=x.a.toFixed(1);athl.textContent=x.x.toFixed(1);str.textContent=x.s.toFixed(1);sections.innerHTML=`<div class="section academics"><div class="sectionHead"><h2>Academics</h2><div class="sectionScore">${x.a.toFixed(1)}</div></div><div class="metric"><span>GPA Range</span><span class="result">${x.gpa}</span><span class="stars">${stars(x.a)}</span></div><div class="privacy">Exact GPA is not shown on the public profile.</div></div><div class="section athleticism"><div class="sectionHead"><h2>Athleticism</h2><div class="sectionScore">${x.x.toFixed(1)}</div></div>${x.tests.map(metric).join('')}</div><div class="section strength"><div class="sectionHead"><h2>Strength</h2><div class="sectionScore">${x.s.toFixed(1)}</div></div>${x.lifts.map(metric).join('')}</div><div class="section sportBonus"><div class="sectionHead"><h2>Sport Bonus</h2><div class="sectionScore">+${x.bonus.toFixed(1)}</div></div>${x.sports.map(z=>`<div class="metric"><span>${z[1]}</span><span class="result">+0.1</span><span class="stars"></span></div>`).join('')}</div><div class="calc"><h2>Overall Score Calculation</h2><div class="calcRow acadText"><span>Academics</span><span>${x.a.toFixed(1)}</span></div><div class="calcRow athText"><span>Athleticism</span><span>${x.x.toFixed(1)}</span></div><div class="calcRow strText"><span>Strength</span><span>${x.s.toFixed(1)}</span></div><div class="calcRow"><span>Component Average</span><span>${((x.a+x.x+x.s)/3).toFixed(1)}</span></div><div class="calcRow bonusText"><span>Sport Bonus</span><span>+${x.bonus.toFixed(1)}</span></div><div class="calcRow total"><span>Overall Score</span><span>${x.o.toFixed(1)}</span></div></div>`;scrollTo(0,0)}
function back(){profile.classList.add('hide');board.classList.remove('hide')}draw();
</script></body></html>
